{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'chatbot/theme.css' %}">
  <title>RAG Assistant</title>
</head>
<body>
  <div class="app-shell">

    <!-- Mobile top bar: only visible on small screens -->
    <div class="mobile-topbar d-flex d-md-none align-items-center justify-content-between">
      <button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>
      <div class="brand-name">Assistant</div>
      <div style="width:32px"></div>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">📖</div>
        <div>
          <div class="brand-name">Assistant</div>
          <div class="brand-sub">RAG ASSISTANT</div>
        </div>
      </div>

      <button class="new-conv-btn" onclick="startNewConversation()">+ New conversation</button>

      <div class="sidebar-section-label">KNOWLEDGE BASE</div>
      <div class="kb-item active">
        <span>Documents</span>
        <span class="kb-count">1</span>
      </div>
    </aside>

    <!-- Dims the page behind the sidebar when open on mobile -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <main class="main-panel">
      <header class="chat-header d-none d-md-flex">
        <div class="header-title">Ask Anything</div>
        <div class="header-badge">Live &amp; document search</div>
        <div class="model-pill">● gemini · flash</div>
      </header>

      <div class="chat-window" id="chat-window"></div>

      <div class="input-bar">
        <textarea id="msg-input" rows="1" placeholder="Ask about your documents, or anything else..."></textarea>
        <div class="input-bar-footer">
          <div class="input-tools">
            <span title="Not wired up yet">📎</span>
            <span title="Not wired up yet">🎤</span>
          </div>
          <button class="send-btn" onclick="sendMessage()">Send ↑</button>
        </div>
      </div>
    </main>

  </div>

  <script src="{% static 'chatbot/chat.js' %}"></script>
</body>
</html>
